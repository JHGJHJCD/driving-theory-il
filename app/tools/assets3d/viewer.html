<!doctype html><meta charset=utf-8><body style="margin:0;background:#9fb7cc"><canvas id=c width=1600 height=1000></canvas>
<script type=module>
import * as THREE from '../../vendor/three.module.min.js';
import { GLTFLoader } from '../../vendor/jsm/GLTFLoader.js';
const names = (new URL(location).searchParams.get('m') || '').split(',').filter(Boolean);
